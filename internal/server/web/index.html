<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BidBrawl</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app ledger refined playful">
    <aside class="sidebar">
      <a class="refined-brand" href="/" data-i18n-aria="home"><span class="refined-mark"><span class="icon icon-brand" aria-hidden="true"></span></span><span>BidBrawl</span></a>
      <nav class="navigation" data-i18n-aria="navigation">
        <button data-page="rooms" data-i18n-aria="rooms"><span class="icon icon-rooms" aria-hidden="true"></span><span data-i18n="rooms"></span></button>
        <button data-page="watch" class="selected" data-i18n-aria="watch"><span class="icon icon-watch" aria-hidden="true"></span><span data-i18n="watch"></span></button>
        <button data-page="stats" data-i18n-aria="stats"><span class="icon icon-stats" aria-hidden="true"></span><span data-i18n="stats"></span></button>
        <button data-page="replay" data-i18n-aria="replay"><span class="icon icon-replay" aria-hidden="true"></span><span data-i18n="replay"></span></button>
      </nav>
      <div class="side-rooms"><p><span data-i18n="rooms"></span> <span id="room-count">0</span></p><div id="rooms"></div></div>
    </aside>
    <div class="workspace">
      <header>
        <div class="breadcrumb"><span id="page-icon" class="icon icon-watch" aria-hidden="true"></span><b id="page-name"></b></div>
        <div class="controls">
          <span id="connection" class="connection" role="status"></span>
          <label class="room-control"><span class="visually-hidden" data-i18n="selectRoom"></span><select id="room-select" data-i18n-aria="selectRoom"></select></label>
          <label class="language-control"><span class="visually-hidden" data-i18n="language"></span><select id="language-select" data-i18n-aria="language"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option></select></label>
          <button id="rules-button" class="quiet" data-i18n-aria="rules"><span class="icon icon-help" aria-hidden="true"></span><span data-i18n="rules"></span></button>
        </div>
      </header>
      <main><div id="error" class="error" role="alert" hidden></div><div id="content" aria-busy="true"></div></main>
    </div>
  </div>
  <dialog aria-labelledby="dialog-title"></dialog>
</body>
</html>
