<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f3efe4"><title>BidBrawl</title><link rel="icon" type="image/png" sizes="512x512" href="/brand-avatar.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/handbook.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app" data-view="rooms">
    <header class="site-header">
      <a class="wordmark" href="/" data-page="rooms" data-i18n-aria="home"><img class="brand-avatar" src="/brand-avatar.png" width="42" height="42" alt=""><span>BidBrawl</span><small data-i18n="club"></small></a>
      <nav data-i18n-aria="navigation">
        <button data-page="rooms"><svg class="icon" aria-hidden="true"><use href="/icons.svg#box"></use></svg><span data-i18n="lobbyNav"></span></button>
        <button data-page="history"><svg class="icon" aria-hidden="true"><use href="/icons.svg#book"></use></svg><span data-i18n="history"></span></button>
        <button data-page="stats"><svg class="icon" aria-hidden="true"><use href="/icons.svg#stats"></use></svg><span data-i18n="stats"></span></button>
        <button data-page="handbook"><svg class="icon" aria-hidden="true"><use href="/icons.svg#help"></use></svg><span data-i18n="handbook"></span></button>
      </nav>
      <div class="site-preferences"><button id="language-button" class="text-button" data-i18n-aria="switchLanguage">EN</button><button id="theme-button" class="icon-button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#theme"></use></svg></button></div>
    </header>
    <aside class="sidebar" id="sidebar" data-i18n-aria="rooms">
      <div class="panel-head"><h2 data-i18n="rooms"></h2><button id="sidebar-toggle" class="icon-button" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="/icons.svg#close"></use></svg></button></div>
      <button class="paper-button" data-action="create-room" id="create-button" data-i18n="createRoom"></button>
      <div class="room-tabs" role="group" data-i18n-aria="roomGroups"><button data-room-group="active" aria-controls="rooms"><span data-i18n="roomsActive"></span><span id="active-room-count">0</span></button><button data-room-group="completed" aria-controls="rooms"><span data-i18n="roomsCompleted"></span><span id="completed-room-count">0</span></button></div><div id="rooms"></div>
    </aside>
    <button class="sidebar-scrim" tabindex="-1" data-i18n-aria="collapseSidebar"></button>
    <div class="workspace"><main><div id="error" class="error" role="alert" hidden></div><div id="content" aria-busy="true"></div></main><footer class="site-footer"><span id="page-name" class="sr-only"></span><span id="connection" class="connection" role="status"></span><div><button id="avatars-button" class="text-button" data-action="avatars" data-i18n="avatarGallery"></button><button id="rules-button" class="text-button" data-i18n="rules" hidden></button></div></footer></div>
  </div>
  <div id="item-tooltip" class="lot-tooltip" role="tooltip" hidden></div>
  <dialog aria-labelledby="dialog-title"></dialog>
</body>
</html>
