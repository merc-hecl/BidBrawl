name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix .github/release --ignore-scripts
      - run: npm test --prefix .github/release
      - run: node --test internal/server/web_test.mjs internal/server/web_live_test.mjs
      - name: Validate release tag and preview notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/release/notes.mjs "$RELEASE_TAG" build/release-notes.md
  package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows/amd64
            artifact: windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: darwin-amd64
          - os: macos-15
            platform: darwin/arm64
            artifact: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/build-desktop -platform ${{ matrix.platform }}
      - name: Prepare installers and standalone CLI archives
        run: node .github/release/assets.mjs pack ${{ matrix.platform }}
      - name: Smoke test Windows CLI from the release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item 'build/release/*-cli.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'cli-smoke'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force
          & (Join-Path $destination 'bidbrawl.exe') handbook -topic start -lang en > (Join-Path $env:RUNNER_TEMP 'cli-handbook.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test Unix CLI from the release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-smoke"
          tar -xzf build/release/*-cli.tar.gz -C "$RUNNER_TEMP/cli-smoke"
          "$RUNNER_TEMP/cli-smoke/bidbrawl" handbook -topic start -lang en > "$RUNNER_TEMP/cli-handbook.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: build/release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix .github/release --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Verify complete asset set and write SHA-256 checksums
        run: node .github/release/assets.mjs checksums
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/release/notes.mjs "$RELEASE_TAG" build/release-notes.md
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > build/existing-release.json; then
            if ! jq -e '.isDraft' build/existing-release.json >/dev/null; then
              echo 'This version is already published; publish changes under a new version.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md --draft=false
