<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BidBrawl</title><link rel="stylesheet" href="desktop.css"></head>
<body><main class="startup"><h1>BidBrawl</h1><p id="status" role="status"></p><div id="actions" hidden><button id="retry"></button><button id="settings"></button><button id="quit"></button></div></main>
<script type="module">
const zh=navigator.language.startsWith('zh'),label=(a,b)=>zh?a:b;
const status=document.querySelector('#status'),actions=document.querySelector('#actions');
async function start(){actions.hidden=true;status.textContent=label('正在启动…','Starting…');try{await window.mygo.call('Desktop.Start');}catch(error){status.textContent=String(error.message||error);actions.hidden=false;}}
for(const [id,zhText,enText,action] of [['retry','重试','Retry',start],['settings','宿主设置','Host settings',()=>window.mygo.call('Desktop.OpenSettings')],['quit','退出','Quit',()=>window.mygo.call('Desktop.Quit')]]){const button=document.querySelector('#'+id);button.textContent=label(zhText,enText);button.onclick=action;}
start();
</script></body></html>
